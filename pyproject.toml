[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-nand-tree"
version = "0.6.2"
description = "Finite NAND-tree quantum-walk experiments with Qiskit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["qiskit", "quantum walk", "nand tree", "quantum algorithms"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14",
  "qiskit>=2.5,<3",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.9"]

[project.scripts]
nandtree = "main:main"

[tool.setuptools]
py-modules = ["main", "example_usage"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qiskit_implementation*", "non_qiskit*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests_folder/tests"]
markers = ["slow: exhaustive Qiskit checks"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
