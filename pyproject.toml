[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-nand-tree-implementation"
version = "0.6.2"
description = "Prototype implementation of quantum NAND-tree evaluation with Qiskit"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "mncrftfrcnm" },
]

dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14",
  "qiskit>=2.4,<2.6",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
nandtree = "main:main"

[tool.setuptools]
py-modules = ["main", "example_usage"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "qiskit_implementation*",
  "non_qiskit*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests_folder/tests"]
markers = [
  "slow: exhaustive Qiskit checks",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
