name: Ruff autofix

on:
  push:
    branches:
      - fix/ruff-lint

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: fix/ruff-lint

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9'

      - name: Remove unused query-walk expression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('qiskit_implementation/query_walk.py')
          text = path.read_text()
          text = text.replace(
              '    list(range(encoded.qubits, encoded.qubits + address_bits))\n',
              '',
          )
          path.write_text(text)
          PY

      - name: Apply Ruff fixes
        run: python -m ruff check . --fix --unsafe-fixes

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Ruff changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ':(glob)**/*.py'
          git commit -m 'Clean Ruff fixes'
          git push
