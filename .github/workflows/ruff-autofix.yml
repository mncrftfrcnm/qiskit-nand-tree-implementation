name: Ruff autofix

on:
  push:
    branches:
      - fix/ruff-lint

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: fix/ruff-lint

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9'

      - name: Apply Ruff fixes
        run: python -m ruff check . --fix --unsafe-fixes

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Ruff changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ':(glob)**/*.py'
          git commit -m 'Fix Ruff lint'
          git push
