<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Calibrated finite NAND-tree separation margins</title>
  <desc id="desc">Bar chart of exact and query separation margins for 2, 4, and 8 leaf profiles.</desc>
  <rect width="900" height="520" fill="white"/>
  <text x="450" y="35" text-anchor="middle" font-family="sans-serif" font-size="22">Calibrated finite NAND-tree separation margins</text>
  <line x1="80" y1="450" x2="860" y2="450" stroke="#222" stroke-width="2"/>
  <line x1="80" y1="70" x2="80" y2="450" stroke="#222" stroke-width="2"/>
  <g font-family="sans-serif" font-size="13" fill="#222">
    <text x="65" y="454" text-anchor="end">0.0</text>
    <text x="65" y="354" text-anchor="end">0.2</text>
    <text x="65" y="254" text-anchor="end">0.4</text>
    <text x="65" y="154" text-anchor="end">0.6</text>
    <text x="65" y="84" text-anchor="end">0.75</text>
  </g>
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="350" x2="860" y2="350"/>
    <line x1="80" y1="250" x2="860" y2="250"/>
    <line x1="80" y1="150" x2="860" y2="150"/>
  </g>
  <g fill="#4c78a8">
    <rect x="120" y="93.2" width="80" height="356.8"/>
    <rect x="370" y="302.4" width="80" height="147.6"/>
    <rect x="620" y="282.3" width="80" height="167.7"/>
  </g>
  <g fill="#f58518">
    <rect x="205" y="250.2" width="80" height="199.8"/>
    <rect x="455" y="313.7" width="80" height="136.3"/>
    <rect x="705" y="285.2" width="80" height="164.8"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">
    <text x="202" y="478">N=2</text>
    <text x="452" y="478">N=4</text>
    <text x="702" y="478">N=8</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222">
    <rect x="665" y="55" width="14" height="14" fill="#4c78a8"/><text x="686" y="67">exact</text>
    <rect x="745" y="55" width="14" height="14" fill="#f58518"/><text x="766" y="67">query</text>
  </g>
  <text x="20" y="260" transform="rotate(-90 20 260)" text-anchor="middle" font-family="sans-serif" font-size="15">separation margin</text>
</svg>
